name: 🚀 Déploiement vers Production

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 23 2 *'

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 📦 Récupération du dépôt
        uses: actions/checkout@v7

      - name: 🛠️ Configuration de Node.js v26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: 📦 Configuration de pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: 📥 Installation des dépendances
        run: pnpm install

      - name: 🧱 Génération du site statique
        run: pnpm run generate
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          CDN_URL: ${{ secrets.PROD_CDN_URL }}
          BASE_EMAIL: ${{ secrets.PROD_BASE_EMAIL }}
          MANAGER_EMAIL: ${{ secrets.PROD_MANAGER_EMAIL }}
          SUPPORT_EMAIL: ${{ secrets.PROD_SUPPORT_EMAIL }}
          BASE_MOBILE: ${{ secrets.PROD_BASE_MOBILE }}
          GMAPS_KEY: ${{ secrets.PROD_GMAPS_KEY }}
          GMAPS_ID: ${{ secrets.PROD_GMAPS_ID }}

      - name: 🔍 Vérification des fichiers générés
        run: ls -la .output/public

      - name: ❌ Échec si .output/public est vide
        run: |
          if [ -z "$(ls -A .output/public)" ]; then
            echo "❌ Le dossier .output/public est vide. La génération a échoué."
            exit 1
          fi

      - name: 🧹 Préparation du dossier de transit
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            rm -rf /var/www/vhosts/univerweb.dz/deploy-staging
            mkdir -p /var/www/vhosts/univerweb.dz/deploy-staging

      - name: 📤 Envoi des fichiers dans le dossier de transit
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          source: .output/public/
          target: /var/www/vhosts/univerweb.dz/deploy-staging
          strip_components: 2

      - name: 🔄 Mise en ligne sans coupure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            set -e
            STAGING=/var/www/vhosts/univerweb.dz/deploy-staging
            WEBROOT=/var/www/vhosts/univerweb.dz/httpdocs
            if [ -z "$(ls -A "$STAGING")" ]; then
              echo "❌ Le dossier de transit est vide. Mise en ligne annulée."
              exit 1
            fi
            if command -v rsync > /dev/null; then
              rsync -a --exclude='*.html' "$STAGING/" "$WEBROOT/"
              rsync -a --delete-after --filter='P /.*' "$STAGING/" "$WEBROOT/"
            else
              echo "⚠️ rsync absent : remplacement par copie locale."
              rm -rf "$WEBROOT"/*
              cp -a "$STAGING/." "$WEBROOT/"
            fi
            rm -rf "$STAGING"

      - name: ✅ Déploiement terminé avec succès
        run: echo "🚀 Le site a été déployé avec succès sur univerweb.dz"
