title: infoElec
description:
  Découvrez infoelec.dz, un site web d’actualité conçu, développé et hébergé par
  Univerweb.
createdAt: 2017-02-12
updatedAt: 2017-02-12
about:
  infoElec est le premier magazine algérien dédié à la filière électrique et
  énergétique. Conçu pour répondre aux besoins des architectes, bureaux
  d’études, électriciens, entreprises du bâtiment. Le magazine informe sur les
  produits, normes, nouvelles technologies et actualités liées à l’électricité
  et à l’énergie.
