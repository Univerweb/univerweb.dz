about:
  مقرها الجزائر، أكوديم هي شركة مبتكرة في مجال الترويج العقاري. بفضل خبرتها
  ورؤيتها الحديثة، تصمم مشاريع عقارية تجمع بين الجودة والتصميم والوظائف.
