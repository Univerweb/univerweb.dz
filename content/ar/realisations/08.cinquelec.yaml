title: سانكيليك
description:
  اكتشف cinquelec.com، موقع ويب كتالوج إلكتروني، تم تصميمه وتطويره واستضافته
  بواسطة يونيفارواب.
createdAt: 2014-12-16
updatedAt: 2014-12-16
about:
  أنشئت سانكيليك في عام 1994. هي شركة متخصصة في استيراد وتوزيع المعدات
  الكهربائية للمباني والصناعة، الإضاءة الصناعية، الإنذارات التقنية وتركيب
  الخزائن الكهربائية.
