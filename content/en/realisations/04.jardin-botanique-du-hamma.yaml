updatedAt: 2026-10-27
about:
  The Hamma Botanical Garden is a botanical garden located in Algiers. Founded
  in 1832, it covers approximately 32 hectares and houses a wide variety of
  plants, including Mediterranean, subtropical, and exotic species. The garden
  is renowned for its botanical diversity, shaded walkways, ponds, and
  sculptures.
