createdAt: 2020-12-20
updatedAt: 2026-10-27
about:
  Botanique Algérie is a national network dedicated to the promotion and
  enhancement of botany in Algeria. It aims to raise public awareness, share
  scientific knowledge, and encourage the preservation of plant biodiversity
  through educational and collaborative initiatives.
